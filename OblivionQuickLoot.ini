; Oblivion Remastered - Quick Loot
[General]
bEnabled=1
; Panel scale (1.0 = sized for 1080p, scales with resolution)
fScale=1.0
; Panel position as a fraction of the screen (left edge X, vertical centre Y)
fPosX=0.56
fPosY=0.50
iMaxRows=7
; Show the panel with "Empty" for empty containers (Activate then opens them normally)
bShowEmpty=1
; Write diagnostic details to OblivionQuickLoot.log (for bug reports)
bDebugLog=0

[Keys]
; Unreal key names, comma separated (E, R, T, MouseScrollUp, Up, Gamepad_FaceButton_Bottom, ...)
; Activate = take the selected item, Open = open the full container menu
Activate=E,Gamepad_FaceButton_Bottom
TakeAll=T,Gamepad_FaceButton_Top
Open=R,Gamepad_FaceButton_Left
ScrollUp=MouseScrollUp,Up,Gamepad_DPad_Up
ScrollDown=MouseScrollDown,Down,Gamepad_DPad_Down
